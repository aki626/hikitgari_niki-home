        <p>
            このオープンチャットはフレンドリーで優しい人がたくさんいます。<br>
            LINE オープンチャット  
            「歌枠・雑談　雑談もぜんぜん〇管理人が結構歌います」  
            のホームページです。

            メンバー一覧を見る
        </a>
    </section>

    <footer>
        <p>© 2026 歌枠・雑談オープンチャット</p>
    </footer>

    <!-- ロード画面フェードアウト（5秒後に消える） -->
    <script>
        setTimeout(() => {
            const loader = document.getElementById("loader");
            loader.style.opacity = "0";
            setTimeout(() => {
                loader.style.display = "none";
            }, 600);
        }, 5000); // ← ここがロード時間（5秒）
    </script>

</body>
