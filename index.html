<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歌枠・雑談オープンチャット</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- ロード画面（％表示） -->
    <div id="loader">
        <div class="percent-box">
            <span id="percent-text">0%</span>
        </div>
        <p>Loading...</p>
    </div>

    <header>
        <h1>歌枠・雑談オープンチャット</h1>
        <p>管理人が結構歌います🎤</p>
    </header>

    <section class="main">
        <h2>ようこそ！</h2>
        <p>
            このオープンチャットはフレンドリーで優しい人がたくさんいます。<br>
            LINE オープンチャット  
            「歌枠・雑談　雑談もぜんぜん〇管理人が結構歌います」  
            のホームページです。
        </p>

        <h2>ルール</h2>
        <ul>
            <li>誹謗中傷や暴言などはやめてください。</li>
            <li>誰かが歌っている最中にはマイクをオフにしてください。</li>
        </ul>

        <h2>参加はこちら</h2>
        <a class="join-button" href="https://openchat.line.me/jp/cover/vH0ZPsfZb97koToVOlrlb_AJPMq50wdPjY1A3ZEXmghF9zzEw5ma70KI6JQ" target="_blank">
            オープンチャットに参加する
        </a>

        <h2>メンバー一覧</h2>
        <a class="join-button" href="https://yatto0912-hash.github.io/Hikigatari-utawaku-WIKI/" target="_blank">
            メンバー一覧を見る
        </a>
    </section>

    <footer>
        <p>© 2026 歌枠・雑談オープンチャット</p>
    </footer>

    <!-- ％ロードの動作 -->
    <script>
        let percent = 0;
        const percentText = document.getElementById("percent-text");

        const interval = setInterval(() => {
            percent += 2; // 2%ずつ増える（約5秒で100%）
            percentText.textContent = percent + "%";

            if (percent >= 100) {
                clearInterval(interval);
                const loader = document.getElementById("loader");
                loader.style.opacity = "0";
                setTimeout(() => {
                    loader.style.display = "none";
                }, 600);
            }
        }, 100); // 0.1秒ごとに更新
    </script>

</body>
</html>
