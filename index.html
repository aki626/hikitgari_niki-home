<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>Mode Switch</title>
<style>
  body {
    margin: 0;
    font-family: system-ui, sans-serif;
    background: #0b0c10;
    color: #fff;
    transition: 0.4s;
  }

  /* ボタン */
  .mode-btn {
    position: fixed;
    top: 20px;
    right: 20px;
    padding: 12px 20px;
    border: none;
    border-radius: 8px;
    background: #222;
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    z-index: 999;
  }

  /* ドパガキモード（虹色モード）画面全体 */
  .dopagaki {
    animation: rainbow-bg 6s linear infinite;
    background-size: 400% 400%;
  }

  @keyframes rainbow-bg {
    0% { background: linear-gradient(90deg,#ff0000,#ff7f00,#ffff00,#00ff00,#00ffff,#0000ff,#8b00ff); background-position: 0% 50%; }
    100% { background: linear-gradient(90deg,#ff0000,#ff7f00,#ffff00,#00ff00,#00ffff,#0000ff,#8b00ff); background-position: 100% 50%; }
  }

  /* 虹色に光る文字 */
  .rainbow-text {
    font-size: 48px;
    font-weight: 700;
    background: linear-gradient(90deg,#ff0000,#ff7f00,#ffff00,#00ff00,#00ffff,#0000ff,#8b00ff);
    background-size: 400% 400%;
    -webkit-background-clip: text;
    color: transparent;
    animation: shine 6s linear infinite;
  }

  @keyframes shine {
    0% { background-position: 0% 50%; }
    100% { background-position: 100% 50%; }
  }
</style>
</head>

<body>

<button class="mode-btn" onclick="toggleMode()">普通モード</button>

<h1 class="rainbow-text">ドパガキモード（虹色モード）</h1>
<p>この画面はあき専用の虹色モード切り替えテストです。</p>

<script>
  let dopagaki = false;

  function toggleMode() {
    dopagaki = !dopagaki;

    if (dopagaki) {
      document.body.classList.add("dopagaki");
      document.querySelector(".mode-btn").textContent = "ドパガキモード";
    } else {
      document.body.classList.remove("dopagaki");
      document.querySelector(".mode-btn").textContent = "普通モード";
    }
  }
</script>

</body>
</html>
